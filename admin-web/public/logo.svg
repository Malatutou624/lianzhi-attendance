<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="50%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#805ad5"/>
    </linearGradient>
    <linearGradient id="clock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 装饰性圆环 -->
  <circle cx="256" cy="200" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="200" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- 时钟外圆 -->
  <circle cx="256" cy="200" r="96" fill="url(#clock)" filter="url(#glow)"/>

  <!-- 时钟刻度 -->
  <g stroke="#1a365d" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="116" x2="256" y2="128"/>   <!-- 12点 -->
    <line x1="340" y1="200" x2="328" y2="200"/>   <!-- 3点 -->
    <line x1="256" y1="284" x2="256" y2="272"/>   <!-- 6点 -->
    <line x1="172" y1="200" x2="184" y2="200"/>   <!-- 9点 -->
  </g>

  <!-- 时针 -->
  <line x1="256" y1="200" x2="256" y2="148" stroke="#1a365d" stroke-width="8" stroke-linecap="round"/>
  <!-- 分针 -->
  <line x1="256" y1="200" x2="300" y2="200" stroke="#4299e1" stroke-width="6" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="256" cy="200" r="8" fill="#1a365d"/>
  <circle cx="256" cy="200" r="4" fill="#4299e1"/>

  <!-- 人脸点（左下角一个小圆点表示打卡） -->
  <circle cx="140" cy="320" r="28" fill="#f6e05e" opacity="0.9"/>
  <circle cx="140" cy="320" r="12" fill="#f6ad55"/>
  <!-- 人脸 -->
  <circle cx="140" cy="316" r="8" fill="#2d3748"/>
  <circle cx="140" cy="322" r="8" fill="#2d3748"/>

  <!-- AI 芯片标记（右下角） -->
  <g transform="translate(340, 310)">
    <rect x="0" y="0" width="48" height="32" rx="6" fill="#68d391"/>
    <text x="24" y="22" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">AI</text>
  </g>

  <!-- 底部品牌名 -->
  <text x="256" y="430" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">联智考勤</text>
  <text x="256" y="470" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" letter-spacing="8">SMART ATTENDANCE</text>
</svg>
