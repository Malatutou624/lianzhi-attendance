name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build & Test
        run: cd server && mvn clean package -B --no-transfer-progress
        env:
          MAVEN_OPTS: -Xmx1g

  admin-web:
    name: PC 管理端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Build
        run: cd admin-web && npm ci --no-audit --no-fund && npm run build

  miniprogram:
    name: 小程序构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Build WeChat
        run: cd miniprogram && npm ci --no-audit --no-fund && npm run build:mp-weixin
