# 后端服务配置
server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库地址：本地 MySQL，库名 lianzhi_attendance
    url: jdbc:mysql://localhost:3306/lianzhi_attendance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Acx20050624
    druid:
      initial-size: 5     # 连接池初始大小
      max-active: 20
  redis:
    host: localhost
    port: 6379
    timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB       # 单个上传文件上限（人脸照片）
      max-request-size: 20MB

mybatis-plus:
  configuration:
    # 控制台打印 SQL 语句，零基础调试必备
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 自定义配置
lianzhi:
  # 照片等文件保存目录：必须用「绝对路径」
  upload-dir: D:\lianzhi-attendance-main\server\uploads
  # 虹软 ArcFace SDK 3.0 配置（课程要求）
  arcface:
    # DLL 所在目录（相对项目根目录）
    lib-dir: D:\lianzhi-attendance-main\server\arcsoft
    # 激活所需 APP_ID 和 SDK_KEY（从虹软官网开发者后台获取）
    app-id: 7UEPMyygfd1HcevCMLT9KESSSg14PjN7PaabYBRna12Z
    sdk-key: GdFLSUJ5BGaAqaJNDS8w7AGbS2fTmfKCbcgZSPizdR5g
    # 激活文件存放目录（激活一次后离线可用）
    active-dir: D:\lianzhi-attendance-main\server\arcsoft
    # 人脸比对相似度阈值：0~1，默认 0.85（0.85 以上判为同一人）
    # 官方推荐 0.8~0.9 之间，课程项目用 0.85
    match-threshold: 0.85
  # 微信小程序配置
  wx:
    appid: wx01e24c0c40273a70
    # 小程序密钥 - 在微信公众平台 → 开发管理 → 开发设置里找
    secret: 67711ea3fc5a4a716b5413b9d438a889
  # 知识库模块配置
  knowledge:
    # 切片参数（默认适合中文文档）
    chunk-max-chars: 500      # 单条切片最大字符数
    chunk-overlap: 80         # 相邻切片重叠字符（保证语义连贯）
    # Embedding 引擎：tfidf(纯本地零Key) / siliconflow(推荐免费) / dashscope(阿里云)
    embedding: tfidf
    # ===== 硅基流动 SiliconFlow（推荐：永久免费 + 不限流）=====
    # 申请地址: https://siliconflow.cn （注册 → 创建 API Key → 零成本）
    siliconflow:
      api-key: ""                    # ← 填你的 SiliconFlow key（两个模块共用）
      # Embedding 模型（OpenAI 兼容格式）
      embedding-model: BAAI/bge-m3   # 中文好，免费
      # Chat 模型（也是 OpenAI 兼容）
      chat-model: deepseek-ai/DeepSeek-V3.2  # 免费强模型
      endpoint-chat: https://api.siliconflow.cn/v1/chat/completions
      endpoint-embedding: https://api.siliconflow.cn/v1/embeddings
    # ===== 阿里百炼 DashScope（备选，偶尔限流）=====
    # api-key 已填在下方 llm.dashscope.api-key 即可复用
    dashscope:
      api-key: ""
      model: text-embedding-v2
  # AI 问答 LLM 配置
  llm:
    # 可选值: siliconflow(推荐免费不限流) / dashscope / ""(空=关闭LLM)
    provider: siliconflow
    siliconflow:
      api-key: ""                    # ← 和 knowledge.siliconflow.api-key 填同一个
      chat-model: deepseek-ai/DeepSeek-V3.2
      endpoint: https://api.siliconflow.cn/v1/chat/completions
    dashscope:
      api-key: ""
      chat-model: qwen-turbo
      endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    rag-top-k: 4
    rag-similarity-threshold: 0.15
  # 知识库文件存储目录（和 uploads 分开）
  knowledge-dir: D:\lianzhi-attendance-main\server\knowledge

# ---------- 地图地理编码（地址→经纬度，给管理端办公场所选点用）----------
amap:
  geocode:
    key: "02c2b5323391bda815f4fe701fc05ac3"   # 高德 Web 服务 API key（免费申请：https://console.amap.com/），留空则降级到 Nominatim 免费服务
