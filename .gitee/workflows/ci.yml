name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建 + 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Test
        run: |
          cd server
          mvn clean test -B --no-transfer-progress
        env:
          MAVEN_OPTS: -Xmx1g

      - name: Maven Package
        run: |
          cd server
          mvn package -DskipTests -B --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: attendance-server-jar
          path: server/target/attendance-server-*.jar
          retention-days: 7

  admin-web:
    name: PC 管理端构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install Dependencies
        run: |
          cd admin-web
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: |
          cd admin-web
          npm run build

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist
          retention-days: 7

  miniprogram:
    name: 小程序构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install Dependencies
        run: |
          cd miniprogram
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build WeChat
        run: |
          cd miniprogram
          npm run build:mp-weixin

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-weixin
          path: miniprogram/dist/build/mp-weixin
          retention-days: 7
